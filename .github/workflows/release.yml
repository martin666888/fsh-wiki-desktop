name: Release

on:
  push:
    tags:
      - "v*"

# 所有版本共用一把发布锁，避免旧任务最后完成而覆盖 latest。
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check versions and release configuration
        id: metadata
        run: npm run check:project

      - name: Validate signature checks and frontend
        run: npm run check

      - name: Validate Rust
        run: npm run check:rust

      - name: Check release target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:prepare

      # 签名密钥只提供给构建步骤；后续验证只读取 tauri.conf.json 内的公钥。
      # 安装器、签名与清单验证完成前保持 draft，不影响用户正在读取的 latest。
      - name: Build signed draft
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "飞书文档轻客户端 ${{ github.ref_name }}"
          releaseBody: "由 GitHub Actions 自动构建并验证安装包、签名和更新清单。"
          releaseDraft: true
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          includeUpdaterJson: false
          args: --ci -- --locked

      - name: Verify installer and upload updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.build.outputs.releaseId }}
        run: npm run release:manifest

      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.build.outputs.releaseId }}
        run: npm run release:publish
