[package]
name = "feishu-desktop"
version = "0.1.7"
description = "飞书文档轻量桌面客户端"
edition = "2021"

[lib]
name = "feishu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
font-loader = "0.11"
