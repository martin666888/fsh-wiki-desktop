[package]
name = "feishu-desktop"
version = "0.1.16"
description = "飞书文档轻量桌面客户端"
edition = "2021"

[lib]
name = "feishu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
font-loader = "0.11"
base64 = "0.22"
minisign-verify = "0.2"
semver = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "time"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
webview2-com = "0.38"
